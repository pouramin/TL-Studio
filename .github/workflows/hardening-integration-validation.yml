name: Native Foundation Integration Validation

on:
  push:
    branches:
      - hardening/integration-agent-foundation
      - refactor/native-agent-tool-round-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format extracted native tool runtime
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/launcher/native_agent_tool_round.go
          if ! git diff --quiet -- cmd/launcher/native_agent_tool_round.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cmd/launcher/native_agent_tool_round.go
            git commit -m 'style(agent): gofmt extracted tool runtime'
            git push origin HEAD:refs/heads/refactor/native-agent-tool-round-runtime
          fi
      - name: Install web dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Native / hardening focused tests
        run: go test -count=1 -v ./cmd/launcher -run 'Test(Native|Phase1|SafeWorkspace|Durable|MCPAmbiguous)'
      - name: Full regression suite
        run: go test -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Race verification
        run: go test -race -count=1 ./cmd/launcher -run 'Test(SafeWorkspaceConcurrentAgentUpdatesOneWinner|DurableAgentJournals|NativeAgentLoopExecutesToolAndContinuesWithoutKilo)'
      - name: Web typecheck and bundle
        run: |
          npm run check:web
          npm run build:web

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies (Windows harness)
        shell: pwsh
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused Windows agent and persistence tests
        shell: pwsh
        run: go test -count=1 ./cmd/launcher -run 'Test(Native|Phase1|SafeWorkspace|Durable|MCPAmbiguous)'
      - name: Full Windows regression suite
        shell: pwsh
        run: go test -count=1 ./...
