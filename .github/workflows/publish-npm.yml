name: Publish npm launcher

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure OIDC-capable npm CLI
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          node --version
          npm --version

      - name: Build isolated npm package
        run: node packaging/npm/build.cjs

      - name: Verify package contents
        working-directory: packaging/npm/dist
        run: |
          set -euo pipefail
          node --check tl-studio.cjs
          npm pack --dry-run --ignore-scripts

      - name: Publish to npmjs with trusted publishing
        working-directory: packaging/npm/dist
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          else
            DIST_TAG="latest"
          fi

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published; nothing to do."
            exit 0
          fi

          echo "Publishing ${NAME}@${VERSION} with dist-tag ${DIST_TAG}"
          npm publish --access public --tag "$DIST_TAG"
