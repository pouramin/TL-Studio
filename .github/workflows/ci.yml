name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI build tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check Browser UI
        run: npm run check:web
      - name: Build Browser UI
        run: npm run build:web
      - name: Verify generated Browser JavaScript is untracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files 'cmd/launcher/web/*.js' | grep -q .; then
            echo "Generated Browser JavaScript must not be committed." >&2
            git ls-files 'cmd/launcher/web/*.js' >&2
            exit 1
          fi
      - name: Verify local Monaco bundle
        run: |
          test -s cmd/launcher/web/monaco-editor.js
          test -s cmd/launcher/web/monaco-editor.css
          test -s cmd/launcher/web/monaco-editor-worker.js
          test -s cmd/launcher/web/monaco-ts-worker.js
          ! grep -R -E 'https?://(cdn|unpkg|jsdelivr)' cmd/launcher/ui/monaco.ts scripts/monaco scripts/build-web.mjs
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify Browser JavaScript syntax
        run: |
          for file in cmd/launcher/web/*.js; do node --check "$file"; done
      - name: Verify npx quick launcher
        run: |
          node --check scripts/npx-launch.cjs
          npm pack --dry-run --ignore-scripts
      - name: Enforce zero Kilo runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          forbidden='KILO_VERSION|kiloRuntime|runtimeHostedProviderID|runtimeBackend|/runtime/|--native-only|--runtime-bin|bin/kilo|bin/kilo.exe|Sign in with Kilo|Kilo account'
          if grep -RniE "$forbidden"             cmd/launcher --include='*.go' --exclude='*_test.go'             cmd/launcher/ui --include='*.ts'             .github/workflows; then
            echo "Production source or workflows still contain a prohibited compatibility-runtime reference." >&2
            exit 1
          fi
      - name: Verify Python test syntax
        run: |
          python3 -m py_compile             scripts/check-native-product-contract.py             scripts/check-provider-config.py             scripts/stage-bundled-plugins.py             scripts/check-bundled-plugin-staging.py
      - name: Validate bundled plugin release manifest
        run: |
          python3 scripts/stage-bundled-plugins.py --validate-only
          python3 scripts/check-bundled-plugin-staging.py
      - name: Cross-compile supported launchers
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/tl-studio.exe ./cmd/launcher
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/tl-studio-linux-x64 ./cmd/launcher
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/tl-studio-linux-arm64 ./cmd/launcher
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/tl-studio-darwin-x64 ./cmd/launcher
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/tl-studio-darwin-arm64 ./cmd/launcher

  # Run the full Go suite natively where process cancellation, file writes,
  # credential stores and filesystem semantics differ from Ubuntu.
  # Ubuntu's full suite is already covered by the "test" job above.
  native-platform-go-tests:
    name: native-go-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI build tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Browser UI
        run: npm run build:web
      - name: Run full native Go suite
        run: go test ./... -count=1
      - name: Vet native Go packages
        run: go vet ./...

  windows-codex-app-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize official Codex app-server through TL Studio
        shell: pwsh
        env:
          TL_STUDIO_REAL_CODEX_SMOKE: '1'
        run: go test ./cmd/launcher -run 'TestRealCodex(AppServerInitialize|ExecCLIContract)Smoke' -count=1 -v

  windows-claude-code:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official Claude Code CLI through TL Studio
        shell: pwsh
        env:
          TL_STUDIO_REAL_CLAUDE_SMOKE: '1'
        run: go test ./cmd/launcher -run TestRealClaudeCLIContractSmoke -count=1 -v

  native-product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build native TL Studio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tl-native
          go build -trimpath -o /tmp/tl-native/tl-studio ./cmd/launcher
          chmod +x /tmp/tl-native/tl-studio
          test ! -e /tmp/tl-native/kilo
          test ! -e /tmp/tl-native/kilo.exe
      - name: Run native product contract
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          STATE_DIR="$(mktemp -d)"
          START_DIR="$PWD"
          cd /tmp
          TL_STUDIO_STATE_DIR="$STATE_DIR" /tmp/tl-native/tl-studio --no-browser --project "$GITHUB_WORKSPACE" >"$LOG" 2>&1 &
          PID=$!
          cd "$START_DIR"
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "--- native launcher log ---"
            cat "$LOG"
          }
          trap cleanup EXIT
          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/local/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          python3 scripts/check-native-product-contract.py "$LOCAL_URL" "$GITHUB_WORKSPACE"

  native-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Browser and launcher
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:web
          npm run build:web
          mkdir -p /tmp/tl-native-browser
          go build -trimpath -o /tmp/tl-native-browser/tl-studio ./cmd/launcher
          chmod +x /tmp/tl-native-browser/tl-studio
      - name: Run real Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          STATE_DIR="$(mktemp -d)"
          START_DIR="$PWD"
          cd /tmp
          TL_STUDIO_STATE_DIR="$STATE_DIR" /tmp/tl-native-browser/tl-studio --no-browser --project "$GITHUB_WORKSPACE" >"$LOG" 2>&1 &
          PID=$!
          cd "$START_DIR"
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "--- native launcher log ---"
            cat "$LOG"
          }
          trap cleanup EXIT
          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/local/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          node scripts/check-workbench-browser-runtime.mjs "$LOCAL_URL"

  windows-editor-save-e2e:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Browser and native Windows application
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o "$env:RUNNER_TEMP/tl-studio-editor.exe" ./cmd/launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Windows Editor / file conflict / in-flight save acceptance
        shell: pwsh
        run: |
          node scripts/check-windows-editor-save-runtime.mjs "$env:RUNNER_TEMP/tl-studio-editor.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-review-package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:web
          npm run build:web
      - name: Resolve review version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "REVIEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "REVIEW_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./...
      - name: Build Windows x64
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p staging/package
          go build -trimpath -ldflags "-s -w -X main.version=${REVIEW_TAG}" -o staging/package/tl-studio.exe ./cmd/launcher
          cp LICENSE THIRD_PARTY_NOTICES.md staging/package/
          mkdir -p staging/package/third_party
          cp -R third_party/. staging/package/third_party/
          python3 scripts/stage-bundled-plugins.py --target windows-x64 --package-dir staging/package
          mkdir -p staging/package/integrations
          cp -R integrations/claude-web-extension staging/package/integrations/
          test -f staging/package/integrations/claude-web-extension/manifest.json
          test -f staging/package/integrations/claude-web-extension/background.js
      - name: Assert review package contains no Kilo runtime
        shell: bash
        run: |
          set -euo pipefail
          if find staging/package -type f \( -iname 'kilo' -o -iname 'kilo.exe' \) -print -quit | grep -q .; then
            echo "Kilo runtime leaked into the Windows review package." >&2
            exit 1
          fi
      - name: Package Windows x64 review build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          FILE="TL-Studio-v${REVIEW_VERSION}-Windows-x64-Review.zip"
          (cd staging/package && zip -qr "../../dist/${FILE}" .)
          sha256sum "dist/${FILE}" > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TL-Studio-${{ env.REVIEW_VERSION }}-Windows-x64-Review
          path: dist/*
          if-no-files-found: error
          retention-days: 14


  # Compatibility status aliases for the current main-branch protection rule.
  # Keep these until the repository rule is updated to require the native job names.
  runtime-product-contract:
    needs: native-product-contract
    runs-on: ubuntu-latest
    steps:
      - name: Confirm native product contract
        run: echo "native-product-contract passed"

  runtime-product-prompt-e2e:
    needs: [test, native-product-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm native Agent regression coverage
        run: echo "native Agent and product tests passed"

  browser-workbench-smoke:
    needs: native-browser-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Confirm native Browser smoke
        run: echo "native-browser-smoke passed"
