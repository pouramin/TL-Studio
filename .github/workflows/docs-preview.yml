name: Docs Preview (GitHub Pages)

on:
  push:
    branches: [docs-site]
    paths:
      - 'website/**'
      - '.github/workflows/docs-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-preview-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static preview
        env:
          DEPLOY_TARGET: static
          NEXT_PUBLIC_BASE_PATH: /TL-Studio
        run: npm run build
      - name: Verify static output
        run: test -f out/index.html && test -f out/docs/index.html && test -f out/llms.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
