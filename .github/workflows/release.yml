name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            goos: windows
            goarch: amd64
            launcher: tl-studio.exe
            kilo_asset: kilo-windows-x64.zip
            kilo_binary: kilo.exe
            kind: zip
          - name: linux-x64
            goos: linux
            goarch: amd64
            launcher: tl-studio
            kilo_asset: kilo-linux-x64.tar.gz
            kilo_binary: kilo
            kind: tar
          - name: linux-arm64
            goos: linux
            goarch: arm64
            launcher: tl-studio
            kilo_asset: kilo-linux-arm64.tar.gz
            kilo_binary: kilo
            kind: tar
          - name: macos-x64
            goos: darwin
            goarch: amd64
            launcher: tl-studio
            kilo_asset: kilo-darwin-x64.zip
            kilo_binary: kilo
            kind: zip
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            launcher: tl-studio
            kilo_asset: kilo-darwin-arm64.zip
            kilo_binary: kilo
            kind: zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install UI build tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check browser runtime contract
        run: npm run check:web
      - name: Build browser UI
        run: npm run build:web
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            test -f VERSION
            VERSION="$(tr -d '[:space:]' < VERSION)"
            test -n "$VERSION"
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./...
      - name: Build launcher
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p staging/package/bin staging/upstream
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "staging/package/${{ matrix.launcher }}" ./cmd/launcher
      - name: Download pinned bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          KILO_VERSION="$(tr -d '[:space:]' < KILO_VERSION)"
          URL="https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/${{ matrix.kilo_asset }}"
          curl --fail --location --retry 3 "$URL" -o "staging/upstream/${{ matrix.kilo_asset }}"
          if [[ "${{ matrix.kind }}" == "zip" ]]; then
            unzip -q "staging/upstream/${{ matrix.kilo_asset }}" -d staging/upstream/extracted
          else
            mkdir -p staging/upstream/extracted
            tar -xzf "staging/upstream/${{ matrix.kilo_asset }}" -C staging/upstream/extracted
          fi
          KILO_BIN="$(find staging/upstream/extracted -type f -name '${{ matrix.kilo_binary }}' | head -n 1)"
          test -n "$KILO_BIN"
          cp "$KILO_BIN" "staging/package/bin/${{ matrix.kilo_binary }}"
          chmod +x "staging/package/${{ matrix.launcher }}" || true
          chmod +x "staging/package/bin/${{ matrix.kilo_binary }}" || true
          cp LICENSE THIRD_PARTY_NOTICES.md staging/package/
          mkdir -p staging/package/third_party
          cp third_party/KILO_LICENSE.txt staging/package/third_party/
      - name: Real bundled-runtime product API contract test
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          BINARY="$GITHUB_WORKSPACE/staging/package/tl-studio"
          START_DIR="$PWD"
          cd /tmp
          "$BINARY" --no-browser --project "$GITHUB_WORKSPACE" >"$LOG" 2>&1 &
          PID=$!
          cd "$START_DIR"
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            cat "$LOG"
          }
          trap cleanup EXIT
          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/runtime/global/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          python3 scripts/check-kilo-project-routing.py "$LOCAL_URL"
          python3 scripts/check-kilo-product-contract.py "$LOCAL_URL"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd staging/package && zip -qr "../../dist/tl-studio-${RELEASE_TAG}-${{ matrix.name }}.zip" .)
          else
            tar -C staging/package -czf "dist/tl-studio-${RELEASE_TAG}-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            test -f VERSION
            VERSION="$(tr -d '[:space:]' < VERSION)"
            test -n "$VERSION"
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc) ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "TL Studio ${RELEASE_TAG}" \
            --generate-notes \
            $PRERELEASE
