name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            goos: windows
            goarch: amd64
            launcher: tl-studio.exe
          - name: linux-x64
            goos: linux
            goarch: amd64
            launcher: tl-studio
          - name: linux-arm64
            goos: linux
            goarch: arm64
            launcher: tl-studio
          - name: macos-x64
            goos: darwin
            goarch: amd64
            launcher: tl-studio
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            launcher: tl-studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install UI build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check browser product API
        run: npm run check:web
      - name: Build browser UI
        run: npm run build:web
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            test -f VERSION
            VERSION="$(tr -d '[:space:]' < VERSION)"
            test -n "$VERSION"
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./...
      - name: Build launcher
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p staging/package
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "staging/package/${{ matrix.launcher }}" ./cmd/launcher
          chmod +x "staging/package/${{ matrix.launcher }}" || true
          cp LICENSE THIRD_PARTY_NOTICES.md staging/package/
          mkdir -p staging/package/third_party
          cp -R third_party/. staging/package/third_party/
      - name: Stage version-pinned bundled plugins
        run: |
          python3 scripts/stage-bundled-plugins.py \
            --target "${{ matrix.name }}" \
            --package-dir staging/package
          mkdir -p staging/package/integrations
          cp -R integrations/claude-web-extension staging/package/integrations/
      - name: Assert package contains no Kilo runtime
        shell: bash
        run: |
          set -euo pipefail
          if find staging/package -type f \( -iname 'kilo' -o -iname 'kilo.exe' \) -print -quit | grep -q .; then
            echo "Kilo runtime leaked into a TL Studio release package." >&2
            find staging/package -type f -iname 'kilo*' -print >&2
            exit 1
          fi
      - name: Native product API contract test
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          STATE_DIR="$(mktemp -d)"
          BINARY="$GITHUB_WORKSPACE/staging/package/tl-studio"
          START_DIR="$PWD"
          cd /tmp
          TL_STUDIO_STATE_DIR="$STATE_DIR" "$BINARY" --no-browser --project "$GITHUB_WORKSPACE" >"$LOG" 2>&1 &
          PID=$!
          cd "$START_DIR"
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            cat "$LOG"
          }
          trap cleanup EXIT
          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/local/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          export TL_STUDIO_LAUNCH_KEY="$(awk '/Auth:/ {print $2; exit}' "$LOG")"
          test -n "$TL_STUDIO_LAUNCH_KEY"
          echo "::add-mask::$TL_STUDIO_LAUNCH_KEY"
          python3 scripts/check-native-product-contract.py "$LOCAL_URL" "$GITHUB_WORKSPACE"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd staging/package && zip -qr "../../dist/tl-studio-${RELEASE_TAG}-${{ matrix.name }}.zip" .)
          else
            tar -C staging/package -czf "dist/tl-studio-${RELEASE_TAG}-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            test -f VERSION
            VERSION="$(tr -d '[:space:]' < VERSION)"
            test -n "$VERSION"
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ARGS=(--generate-notes)
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            RELEASE_ARGS=(--notes-file "$NOTES_FILE")
          fi
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc) ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "TL Studio $RELEASE_TAG" \
            "${RELEASE_ARGS[@]}"
