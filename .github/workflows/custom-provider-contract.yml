name: Custom Provider Contract

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  native-custom-provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Verify contract test syntax
        run: python3 -m py_compile scripts/check-provider-config.py
      - name: Build TL Studio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tl-provider-contract
          go build -trimpath -o /tmp/tl-provider-contract/tl-studio ./cmd/launcher
          chmod +x /tmp/tl-provider-contract/tl-studio
          test ! -e /tmp/tl-provider-contract/kilo
          test ! -e /tmp/tl-provider-contract/kilo.exe
      - name: Run native custom-provider contract
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          STATE_DIR="$(mktemp -d)"
          START_DIR="$PWD"
          cd /tmp
          TL_STUDIO_STATE_DIR="$STATE_DIR" /tmp/tl-provider-contract/tl-studio --no-browser --project "$GITHUB_WORKSPACE" >"$LOG" 2>&1 &
          PID=$!
          cd "$START_DIR"
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "--- launcher log ---"
            cat "$LOG"
          }
          trap cleanup EXIT

          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/local/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          python3 scripts/check-provider-config.py "$LOCAL_URL"


  # Compatibility status alias for the current main-branch protection rule.
  runtime-custom-provider-contract:
    needs: native-custom-provider-contract
    runs-on: ubuntu-latest
    steps:
      - name: Confirm native custom-provider contract
        run: echo "native-custom-provider-contract passed"
