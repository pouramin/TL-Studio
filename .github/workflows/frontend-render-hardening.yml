name: Frontend Render Lifecycle Hardening

on:
  push:
    branches:
      - refactor/frontend-message-render-lifecycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Frontend render lifecycle regression
        run: |
          node scripts/check-message-render-lifecycle.cjs
          node scripts/check-status-ui-regressions.cjs
          node scripts/check-status-diagnostics.cjs
      - name: Full Go tests
        run: go test -count=1 ./...
      - name: Go vet
        run: go vet ./...
      - name: Frontend typecheck and production build
        run: |
          npm run check:web
          npm run build:web

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies
        shell: pwsh
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Message rendering regression
        shell: pwsh
        run: |
          node scripts/check-message-render-lifecycle.cjs
          node scripts/check-status-ui-regressions.cjs
          node scripts/check-status-diagnostics.cjs
      - name: Full Windows Go tests
        shell: pwsh
        run: go test -count=1 ./...
      - name: Frontend typecheck
        shell: pwsh
        run: npm run check:web
