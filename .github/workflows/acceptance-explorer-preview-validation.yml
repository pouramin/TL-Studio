name: Explorer Preview Project UX Regression

on:
  push:
    branches:
      - fix/acceptance-explorer-preview-project-entry

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: New acceptance tests
        run: go test -count=1 -v ./cmd/launcher -run '^TestAcceptance'
      - name: Full Go regression
        run: go test -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: UI typecheck and bundle
        run: |
          npm run check:web
          npm run build:web
      - name: Existing frontend regressions
        run: |
          node scripts/check-frontend-view-state.cjs
          node scripts/check-message-render-lifecycle.cjs
          node scripts/check-status-ui-regressions.cjs
          node scripts/check-status-diagnostics.cjs
          node scripts/check-provider-recovery.cjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: New acceptance tests
        shell: pwsh
        run: go test -count=1 -v ./cmd/launcher -run '^TestAcceptance'
      - name: Windows full Go tests
        shell: pwsh
        run: go test -count=1 ./...
      - name: UI typecheck
        shell: pwsh
        run: npm run check:web
